<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Project defaults</title>
<style>
:root{--bg:#1d232a;--panel:#232a33;--panel2:#2a323d;--line:#38424f;--text:#e6ebf2;--dim:#9aa7b8;--pri:#6d78f0;--ok:#35c28d;--warn:#e8b64a;--err:#ee6b7e;--r:8px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,sans-serif}
.bar{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 16px;background:#3a2f12;border-bottom:1px solid #6b5518;color:#f3d98a}
.bar button{background:#2a2410;color:#f3d98a;border:1px solid #6b5518;border-radius:6px;padding:4px 10px;cursor:pointer}
.bar button.on{background:#f3d98a;color:#2a2410}
.bar .gap{width:14px}
main{max-width:1100px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:0 0 2px}h2{font-size:15px;margin:0}h3{font-size:12px;margin:0 0 6px;color:var(--dim);text-transform:uppercase;letter-spacing:.04em}
.sub,.dim{color:var(--dim)}.sub{margin-bottom:12px}
.crumb{color:var(--dim);margin-bottom:6px}
.card,details.sec{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px;min-width:0}
.card{padding:14px}
details.sec>summary{display:flex;gap:10px;align-items:center;cursor:pointer;padding:11px 14px;list-style:none}
details.sec>summary::before{content:"\25B6";font-size:10px;color:var(--dim)}
details.sec[open]>summary::before{content:"\25BC"}
details.sec>summary h2{flex:1}
.in{padding:0 14px 14px}
.badge{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;border:1px solid var(--line);color:var(--dim);white-space:nowrap}
.badge.warn{color:var(--warn);border-color:var(--warn)}.badge.pri{color:#aab2ff;border-color:var(--pri)}.badge.ok{color:var(--ok);border-color:var(--ok)}
.fgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
label{display:block;color:var(--dim);font-size:12px;margin-bottom:2px}
select,input{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:5px 8px;font:inherit;width:100%}
input[type=number]{text-align:right}
.changed select,.changed input,select.changed,input.changed{border-color:var(--warn)}
button.b{background:var(--pri);color:#fff;border:0;border-radius:6px;padding:7px 14px;cursor:pointer;font:inherit}
button.b.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
button.b.dirty{background:var(--warn);color:#201a08}
button.b.sm{padding:3px 9px;font-size:12px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.skills{display:grid;gap:6px 24px;grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.skill{display:flex;gap:8px;align-items:center;justify-content:space-between}
.skill input{width:62px}
.ghead{display:flex;gap:10px;align-items:center;margin:12px 0 6px}.ghead h3{margin:0;flex:1}
.savebar{position:sticky;bottom:0;background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.note{border-left:3px solid var(--warn);padding:4px 10px;color:var(--dim);margin:8px 0}
.banner{border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;margin-bottom:12px;background:var(--panel2)}
table{width:100%;border-collapse:collapse}
th,td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{color:var(--dim);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
td.v{width:260px}td.g{padding-top:14px;color:var(--dim);font-size:12px;text-transform:uppercase;font-weight:600}
.scroll{overflow-x:auto}
.about{max-width:1100px;margin:0 auto;padding:0 16px 24px}
.ro{display:block;background:transparent;border:1px dashed var(--line);border-radius:6px;padding:5px 8px;text-align:right;min-height:32px}
.lvl{display:inline-block;width:62px;text-align:right}
.zero{color:var(--dim)}
.src{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:10px}
.src>div:first-child{width:260px}
.later{border:1px dashed var(--pri);border-radius:var(--r);padding:8px 12px;margin-bottom:10px;color:#aab2ff;font-size:12px}
details.inner{border:1px solid var(--line);border-radius:6px;margin-top:12px}
details.inner>summary{display:flex;gap:10px;align-items:center;cursor:pointer;padding:8px 12px;list-style:none}
details.inner>summary::before{content:"\25B6";font-size:10px;color:var(--dim)}
details.inner[open]>summary::before{content:"\25BC"}
details.inner>summary h2{flex:1}
.toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 16px;z-index:60}
a{color:#aab2ff}
</style>
</head>
<body>
<div class="bar">
  <b>Mockup, fake data</b>
  <span class="gap"></span><span>Layout:</span>
  <button data-k="layout" data-v="a">A Sections</button>
  <button data-k="layout" data-v="b">B One page</button>
  <button data-k="layout" data-v="c">C Compare</button>
  <span class="gap"></span><span>State:</span>
  <button data-k="state" data-v="never">Never saved</button>
  <button data-k="state" data-v="saved">Saved</button>
  <button data-k="state" data-v="nofac">No facility yet</button>
  <span class="gap"></span><span>Skill groups:</span>
  <button data-k="groups" data-v="kind">By kind</button>
  <button data-k="groups" data-v="game">Game's groups</button>
  <span class="gap"></span><span>Builder (later):</span>
  <button data-k="src" data-v="typed">Typed</button>
  <button data-k="src" data-v="char">Character</button>
  <button data-k="src" data-v="perm">Needs permission</button>
  <button data-k="src" data-v="nofetch">Not fetched</button>
  <span class="gap"></span>
  <button data-k="view" data-v="page">Defaults page</button>
  <button data-k="view" data-v="project">On a project</button>
  <button data-k="view" data-v="links">The two links</button>
</div>
<main id="app"></main>
<div class="about" id="about"></div>
<script>
const SK = {
  "Ship construction": ["Advanced Capital Ship Construction","Advanced Industrial Ship Construction","Advanced Large Ship Construction","Advanced Medium Ship Construction","Advanced Small Ship Construction"],
  "Starship engineering": ["Amarr Starship Engineering","Caldari Starship Engineering","Gallente Starship Engineering","Minmatar Starship Engineering","Triglavian Quantum Engineering","Upwell Starship Engineering"],
  "Science and engineering": ["Electromagnetic Physics","Electronic Engineering","Graviton Physics","High Energy Physics","Hydromagnetic Physics","Laser Physics","Mechanical Engineering","Molecular Engineering","Nanite Engineering","Nuclear Physics","Plasma Physics","Quantum Physics","Rocket Science"],
  "Other": ["Mutagenic Stabilization","Outpost Construction"]
};
const PRODUCTION = new Set([...SK["Ship construction"],"Outpost Construction"]);
const ALL = Object.values(SK).flat().sort();
const gameGroups = () => ({"Production": ALL.filter(s=>PRODUCTION.has(s)), "Science": ALL.filter(s=>!PRODUCTION.has(s))});

// [key, label, built-in, saved, type, options]
const FIELDS = {
  "Builder": [["ind","Industry",0,5],["adv","Advanced Industry",0,5],["imp","Implant, % time saved",0,4]],
  "Costing": [["basis","Price basis","Jita sell","Jita split","sel",["Jita sell","Jita buy","Jita split"]],
    ["fac","Default facility","None","Dodenvle Azbel","fac"],["haul","Hauling, ISK per m³",0,350],["fee","Contract fee, flat",10000,25000],["hour","Time value, ISK per hour",0,0]],
  "Job splitting": [["split","How runs are split","Least cost","Least cost","sel",["Least cost","Copies first"]],["longest","Longest job, days","","7"]],
  "Quote": [["mode","Quote mode","Cost plus margin","Cost plus margin","sel",["Cost plus margin","Market-referenced"]],
    ["margin","Margin, %",20,15],["prem","Premium on market, %",0,0],["step","Round the quote up to",1000,10000]]
};
const SAVED_SKILLS = {"Advanced Medium Ship Construction":4,"Amarr Starship Engineering":4,"Gallente Starship Engineering":3,"Mechanical Engineering":5,"Nanite Engineering":4};

let S = {layout:"b",state:"saved",groups:"kind",src:"typed",view:"page",dirty:false,open:{}};
const never = () => S.state === "never";
const val = f => never() ? f[2] : (S.state==="nofac" && f[4]==="fac" ? "None" : f[3]);
const level = n => never() ? 0 : (SAVED_SKILLS[n]||0);
const CHARS = ["Mira Voss","Tovan Rell"];
const CHAR_SKILLS = {"Advanced Medium Ship Construction":5,"Advanced Small Ship Construction":4,"Amarr Starship Engineering":4,"Gallente Starship Engineering":5,"Mechanical Engineering":5,"Nanite Engineering":4,"Electronic Engineering":3,"High Energy Physics":4};
const fromChar = () => S.src==="char";
const shown = n => fromChar() ? (CHAR_SKILLS[n]||0) : level(n);
const setCount = () => ALL.filter(n=>shown(n)>0).length;

function control(f){
  const v = val(f);
  if(f[4]==="sel") return `<select data-f="${f[0]}">${f[5].map(o=>`<option ${o===v?"selected":""}>${o}</option>`).join("")}</select>`;
  if(f[4]==="fac"){
    const opts = S.state==="nofac" ? ["None","Add a new facility…"] : ["None","Dodenvle Azbel","Amarr Sotiyo","Add a new facility…"];
    return `<select data-f="${f[0]}">${opts.map(o=>`<option ${o===v?"selected":""}>${o}</option>`).join("")}</select>`
      + (S.state==="nofac"?`<div class="dim" style="font-size:12px">You have no facility yet. <a href="#">Add one</a>, then choose it here.</div>`:"");
  }
  return `<input type="number" data-f="${f[0]}" value="${v}" ${f[0]==="longest"?'placeholder="no limit"':""} ${["ind","adv"].includes(f[0])?'min="0" max="5"':""}>`;
}
const grid = name => `<div class="fgrid">${FIELDS[name].map(f=>`<div><label>${f[1]}</label>${control(f)}</div>`).join("")}</div>`;
const lv = n => `<select data-s="${n}" style="width:62px">${[0,1,2,3,4,5].map(i=>`<option ${i===level(n)?"selected":""}>${i}</option>`).join("")}</select>`;
function skillList(only){
  const groups = S.groups==="kind" ? SK : gameGroups();
  return Object.entries(groups).map(([g,list])=>{
    const l = only ? list.filter(n=>only.includes(n)) : list;
    if(!l.length) return "";
    const setAll = fromChar() ? "" : `<span class="dim" style="font-size:12px">Set all</span>
      <select data-all="${g}" style="width:62px"><option>…</option>${[0,1,2,3,4,5].map(i=>`<option>${i}</option>`).join("")}</select>`;
    return `<div class="ghead"><h3>${g}</h3>${setAll}</div><div class="skills">${l.map(n=>`<div class="skill"><span>${n}</span>${
      fromChar() ? `<span class="lvl ${shown(n)?"":"zero"}">${shown(n)}</span>` : lv(n)}</div>`).join("")}</div>`;
  }).join("");
}
const NOW = "2026-11-26 08:12 UTC";
function source(where){
  const pick = S.src==="typed" ? "Typed" : S.src==="char" ? CHARS[0] : CHARS[1];
  const opts = ["Typed",...CHARS].map(o=>`<option ${o===pick?"selected":""}>${o}</option>`).join("");
  let side = "";
  if(S.src==="char") side = where==="project"
    ? `<span class="dim">Copied from ${CHARS[0]}, ${NOW}</span><button class="b ghost sm" data-act="update">Update from character</button>`
    : `<span class="dim">Skills fetched ${NOW} · implants fetched 2026-11-20 17:40 UTC</span><button class="b ghost sm" data-act="update">Update skills</button><button class="b ghost sm" data-act="update">Update implants</button>`;
  let note = "";
  if(S.src==="perm") note = `<div class="banner" style="border-color:var(--warn)">${CHARS[1]} has not allowed EveAssist to read skills and implants. <a href="#">Re-authorize ${CHARS[1]}</a>. Until then the typed values below are used.</div>`;
  if(S.src==="nofetch") note = `<div class="banner">The skills of ${CHARS[1]} are not fetched yet. The typed values below are used until they are. <button class="b ghost sm" data-act="update">Fetch now</button></div>`;
  return `<div class="src"><div><label>Skills from</label><select data-src>${opts}</select></div>${side}</div>${note}`;
}
function builderFields(){
  if(!fromChar()) return grid("Builder");
  const ro = (l,v,extra) => `<div><label>${l}</label><span class="ro">${v}</span>${extra||""}</div>`;
  return `<div class="fgrid">${ro("Industry",5)}${ro("Advanced Industry",4)}${ro("Implant, % time saved",4,'<div class="dim" style="font-size:12px">from 1 industry implant</div>')}</div>`;
}
function builderBody(){
  const later = S.src==="typed" ? "" : '<div class="later">Later work, not part of step 3: character skills as the source.</div>';
  return later + source("defaults") + builderFields()
    + `<details class="inner" data-id="skills" ${S.open.skills?"open":""}><summary><h2>Blueprint skills</h2>${skillBadge()}</summary><div class="in">
       ${fromChar()?'<div class="dim" style="margin-top:6px">The levels the character can use now. A skill the character has not trained is 0.</div>':""}${skillList()}</div></details>`;
}
const NEEDED = ["Advanced Medium Ship Construction","Amarr Starship Engineering","Mechanical Engineering"];
function projectView(){
  return `<div class="crumb"><a href="#">Projects</a> / Legion for a buyer</div><h1>Legion for a buyer</h1>
    <div class="sub">The project page's Settings section, builder part only. The project holds its own copy.</div>
    ${S.src==="typed"?"":'<div class="later">Later work, not part of step 3.</div>'}
    <div class="card"><h2 style="margin-bottom:10px">Settings</h2><h3>Builder</h3>${source("project")}${builderFields()}
      <h3 style="margin-top:14px">Skills the items need</h3><div class="skills">${NEEDED.map(n=>`<div class="skill"><span>${n}</span>${fromChar()?`<span class="lvl">${shown(n)}</span>`:lv(n)}</div>`).join("")}</div>
      <div class="dim" style="margin-top:12px">Facility, price basis and rates follow here, as today.</div></div>`;
}
const sec = (id,title,badge,body) => `<details class="sec" data-id="${id}" ${S.open[id]?"open":""}><summary><h2>${title}</h2>${badge}</summary><div class="in">${body}</div></details>`;
const saveBtn = () => `<button class="b ${S.dirty?"dirty":""}" data-act="save">Save defaults</button>
  <button class="b ghost" data-act="reset" ${never()?"disabled":""}>Reset to built-in values</button>
  <span class="warn" style="color:var(--warn);font-size:12px">${S.dirty?"Unsaved changes":""}</span>`;
const head = () => `<div class="crumb"><a href="#">Projects</a> / Project defaults</div><h1>Project defaults</h1>
  <div class="sub">A new project starts from these. Changing them does not change projects you already have.</div>
  ${never()?'<div class="banner">You have not saved any defaults. These are the built-in values.</div>':""}`;
const skillBadge = () => `<span class="badge ${setCount()?"pri":""}">${setCount()} of ${ALL.length} set</span>`;

const OTHERS = ["Costing","Job splitting","Quote"];
const LAYOUT = {
  a(){
    const f = FIELDS, v = k => val(Object.values(f).flat().find(x=>x[0]===k));
    const b = t => `<span class="badge">${t}</span>`;
    const who = fromChar() ? CHARS[0] : "Typed";
    return head()
      + sec("costing","Costing",b(`${v("basis")} · ${v("fac")}`),grid("Costing"))
      + sec("split","Job splitting",b(v("split")),grid("Job splitting"))
      + sec("quote","Quote",b(v("mode")),grid("Quote"))
      + sec("builder","Builder",b(who)+skillBadge(),builderBody())
      + `<div class="savebar">${saveBtn()}</div>`;
  },
  b(){
    return head() + `<div class="card">${OTHERS.map(n=>`<h3 style="margin-top:6px">${n}</h3>${grid(n)}<div style="height:10px"></div>`).join("")}</div>`
      + `<div class="card"><h3>Builder</h3>${builderBody()}</div>`
      + `<div class="savebar">${saveBtn()}</div>`;
  },
  c(){
    const rows = OTHERS.map(g=>`<tr><td class="g" colspan="3">${g}</td></tr>`+FIELDS[g].map(f=>{
      const diff = String(val(f))!==String(f[2]);
      return `<tr><td>${f[1]}</td><td class="v ${diff?"changed":""}">${control(f)}</td><td class="dim">${f[2]===""?"no limit":f[2].toLocaleString("en-US")} ${diff?'<span class="badge warn">changed</span>':""}</td></tr>`}).join("")).join("");
    return head() + `<div class="row" style="margin-bottom:12px">${saveBtn()}</div>
      <div class="card scroll"><table><thead><tr><th>Setting</th><th>Your default</th><th>Built-in</th></tr></thead><tbody>${rows}</tbody></table></div>`
      + `<div class="card"><h3>Builder</h3>${builderBody()}</div>`;
  }
};
const links = () => `
  <h3>On the Projects list</h3>
  <div class="card"><div class="row"><div style="flex:1"><h1>Projects</h1><div class="dim">A project is a plan costed for one buyer.</div></div>
    <button class="b ghost sm" data-k2="page">Project defaults</button><button class="b sm">Start from a plan</button></div></div>
  <h3>On the account page</h3>
  <div class="card"><h1>Your account</h1><p class="dim">Display name, account id, roles</p>
    <h2>Preferences</h2><p><a href="#" data-k2="page">Project defaults</a> <span class="dim">: what a new project starts from.</span></p>
    <h2>Your data</h2><div class="row" style="margin-top:6px"><button class="b ghost sm">Download my data</button><button class="b ghost sm" style="border-color:var(--err);color:var(--err)">Delete my account</button></div></div>`;
const ABOUT = {
  a:"<b>A Sections.</b> Like the project page: closed sections with a summary on each header, one Save for the whole page in a bar that stays in view. The Builder section holds the skills and says on its header where they come from.",
  b:"<b>B One page.</b> Every setting visible without clicking. The Builder block comes last, with the blueprint skills in a closed section inside it. Fastest to read and edit; the longest of the three on a phone.",
  c:"<b>C Compare.</b> A table with your value beside the built-in one and a mark where they differ. The Builder block cannot join the table, since a built-in value means little for a character, so the page has two styles."
};
function render(){
  document.querySelectorAll(".bar button").forEach(b=>b.classList.toggle("on",S[b.dataset.k]===b.dataset.v));
  document.getElementById("app").innerHTML = S.view==="links" ? links() : S.view==="project" ? projectView() : LAYOUT[S.layout]();
  const open = S.src==="typed" ? '"Set all" beside each skill group is an optional extra: tell me if you do not want it.'
    : "Not decided: whether a project can override a character's level (not offered here), and what happens to copied levels when a character is removed.";
  document.getElementById("about").innerHTML = S.view==="links" ? "" : `<div class="note">${S.view==="page"?ABOUT[S.layout]+"<br>":""}${open}</div>`;
}
function toast(t){const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
function markDirty(){ if(!S.dirty){S.dirty=true;const btn=document.querySelector('[data-act=save]');if(btn){btn.classList.add("dirty");btn.parentElement.querySelector("span.warn, span[style]").textContent="Unsaved changes"}} }
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-k],[data-k2],[data-act]"); if(!t) return;
  if(t.dataset.act==="update"){S.src="char";toast("Fetched from the character (mockup)");render();return;}
  if(t.dataset.k){S[t.dataset.k]=t.dataset.v;S.dirty=false;render();}
  else if(t.dataset.k2){e.preventDefault();S.view="page";render();}
  else if(t.dataset.act==="save"){S.dirty=false;toast("Defaults saved (mockup)");render();}
  else if(confirm("Reset to the built-in values? Your saved defaults, skill levels included, are removed.")){S.state="never";S.dirty=false;render();}
});
document.addEventListener("toggle",e=>{if(e.target.dataset&&e.target.dataset.id)S.open[e.target.dataset.id]=e.target.open},true);
document.addEventListener("input",e=>{
  if(e.target.dataset.src!==undefined){S.src=e.target.value==="Typed"?"typed":e.target.value===CHARS[0]?"char":"perm";render();markDirty();return;}
  if(e.target.dataset.all!==undefined){const box=e.target.closest(".ghead").nextElementSibling;box.querySelectorAll("select").forEach(s=>s.value=e.target.value)}
  if(e.target.closest("main"))markDirty();
});
render();
</script>
</body>
</html>
