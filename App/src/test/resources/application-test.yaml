# production migrations, then test-only SQL (see documentation/architecture/data.md)
spring:
  flyway:
    locations: classpath:db/migration,classpath:db/test
  # no Keycloak in tests: sign-in is simulated, so these endpoints are never called
  security:
    oauth2:
      client:
        provider:
          keycloak:
            authorization-uri: http://keycloak.invalid/auth
            token-uri: http://keycloak.invalid/token
            jwk-set-uri: http://keycloak.invalid/certs
        registration:
          keycloak:
            client-secret: test-secret
            redirect-uri: "{baseUrl}/login/oauth2/code/keycloak"
eveassist:
  characters:
    # a fixed key for tests only: 32 bytes of 0x01
    token-data-key: AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE=
  market:
    contracts:
      # tests call the loader themselves, so nothing else asks the test ESI in the background
      background: false
