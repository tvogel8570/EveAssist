# The text of the home page: the welcome, the first steps and the FAQs. Edit it here.
#
# - A step is help.stepN.*; the page shows steps 1 to 6.
# - An FAQ is help.faq.<group>.<n>.q (the question) and help.faq.<group>.<n>.a (the answer), where <group> is start, safety,
#   inventory or plans and <n> counts from 1. Add one by using the next number: the page shows every number that exists,
#   up to 30 in a group.
# - An answer may hold HTML, such as a link to a page of EveAssist (<a class="link" href="/characters">...</a>). Text
#   without placeholders is not run through MessageFormat, so apostrophes and quotes are written as they are.

home.intro=EveAssist is a tool for EVE Online industry that runs in your browser. It shows what your characters own, helps you plan what to build, and prices blueprint copies. It only ever asks EVE for read-only permissions, so it cannot change anything in the game.
home.signIn=Sign in with EVE
home.try.title=Try a plan without signing in
home.try.text=Pick a ship or an item, say how many you want, and see the parts, the runs and what it costs at Jita prices. We do not keep your plan: it stays in your browser, so it needs no account.
home.try.button=Try a plan
home.signedIn=You are signed in. Pick up the steps below where you left off, or open the page you need from the top bar.
home.jump.steps=First steps
home.jump.faq=Questions and answers

home.steps.title=Your first steps
home.steps.intro=Do these in order the first time. Each one opens the page where you do it.
home.step=Step {0}

help.step1.title=Sign in with your EVE account
help.step1.text=EveAssist uses your EVE account to know who you are. Signing in does not give EveAssist access to any of your characters.
help.step1.signIn=Sign in
help.step1.account=Your account

help.step2.title=Choose what EveAssist may read
help.step2.text=On the Characters page, turn on the features you want. Inventory shows what your characters own. Corporation assets adds what your corporations hold, and needs a character with the Director role. EveAssist asks EVE only for the read-only permissions the features that are on need, and the page lists them.
help.step2.button=Open Characters

help.step3.title=Link a character
help.step3.text=Press Link a character and sign in to EVE as the character you want to add. Do this for each character, from any of your game accounts. You can link or remove characters whenever you like.
help.step3.button=Open Characters

help.step4.title=Look at your Inventory
help.step4.text=The first time, EveAssist reads your characters' assets from EVE, which can take a minute with many characters. The page shows what it has and updates as the answers arrive. Search, filter, and open an item to see where each stack is.
help.step4.button=Open Inventory

help.step5.title=Plan what to build
help.step5.text=Make a plan: add the ships or items you want to build and how many. EveAssist works out the materials, which parts to build or buy, and the cost at current Jita prices. Prices change only when you refresh them.
help.step5.button=Open Plans

help.step6.title=Find blueprint copies
help.step6.text=Search for a blueprint to see what its copies cost per run, worked out from public item exchange contracts in The Forge. You do not need a linked character for this.
help.step6.button=Open Blueprint copies

home.faq.title=Questions and answers
home.faq.start=Getting started
home.faq.safety=Permissions and privacy
home.faq.inventory=Inventory
home.faq.plans=Plans

help.faq.start.1.q=What is EveAssist?
help.faq.start.1.a=An out-of-game tool for EVE Online industry. It reads what your characters own from EVE and shows it in one searchable list, helps you plan what to build and what it costs, and shows what blueprint copies cost on the market. It runs in your browser. Nothing is installed in the game.
help.faq.start.2.q=Do I have to link a character?
help.faq.start.2.a=Not for <a class="link" href="/plans">Plans</a> or <a class="link" href="/market/blueprint-copies">Blueprint copies</a>: they use market prices and the game's data, not your characters. <a class="link" href="/inventory">Inventory</a> needs at least one linked character.
help.faq.start.3.q=How many characters can I link?
help.faq.start.3.a=As many as you like, from any of your game accounts. Link each one on the <a class="link" href="/characters">Characters</a> page. A character can be linked to only one EveAssist account at a time.

help.faq.safety.1.q=Can EveAssist change anything in the game?
help.faq.safety.1.a=No. EveAssist asks EVE only for read-only permissions, and ESI, EVE's API, has no way to move ISK, items or ships. The <a class="link" href="/characters">Characters</a> page lists, in plain words, the permissions each character has given.
help.faq.safety.2.q=Which permissions does it ask for, and why?
help.faq.safety.2.a=Only the ones the features you turned on need, and the page says which feature needs which. Inventory asks to read your assets and the names of structures. Corporation assets also asks to read corporation assets, hangar names and corporation roles. Turn a feature off and EveAssist stops using its permissions, and the Characters page offers to drop the ones nothing uses any more.
help.faq.safety.3.q=When does EveAssist read my data?
help.faq.safety.3.a=Only while you are signed in. Nothing is read for someone who is signed out. After you open a page that needs data, EveAssist reads it in the background and shows what it already has first.
help.faq.safety.4.q=How do I take EveAssist's access away?
help.faq.safety.4.a=Remove the character on the <a class="link" href="/characters">Characters</a> page: EveAssist deletes its saved access and its stored data at once and asks EVE to end the access. You can also remove EveAssist from your EVE account's list of authorized third-party applications on CCP's developer site, without needing EveAssist at all.
help.faq.safety.5.q=Is my saved access stored safely?
help.faq.safety.5.a=For each linked character EveAssist keeps one thing that could be misused, a refresh token, and stores it encrypted. It is never written to logs or shown. Because the permissions are read-only, a leaked token could reveal information but could not act as your character.
help.faq.safety.6.q=What does EveAssist keep about my characters?
help.faq.safety.6.a=Only the latest copy of what the features you turned on use, with no history. For Inventory that is the items, where they are, and the names of containers. Reading again replaces the copy.

help.faq.inventory.1.q=Why is Inventory empty or "Updating" the first time?
help.faq.inventory.1.a=The first read of every character's assets can take a minute. The page shows what it has and fills in as each character answers. The line above the list says how each character is doing, and opens into a table.
help.faq.inventory.2.q=Why does Refresh sometimes find nothing new?
help.faq.inventory.2.a=EVE keeps its copy of a character's assets for about an hour. Refresh asks again, but EVE may answer that nothing has changed. Refresh always reads container names again, because renaming a container does not change the list.
help.faq.inventory.3.q=What are item types, stacks and units?
help.faq.inventory.3.a=An item type is one kind of item. A stack is one row of EVE's asset list: a pile of identical items in one place, or one assembled item such as a ship or a container. Units are the total quantity, which bulk items such as ore and ammunition make very large, so the number of stacks is often the more useful one.
help.faq.inventory.4.q=What does "name unknown" mean on a structure?
help.faq.inventory.4.a=EVE tells a player structure's name only to a character that can dock there. When none of your characters can, EveAssist shows "Unknown structure" and its number.
help.faq.inventory.5.q=What do the amber and red notes under "How" mean?
help.faq.inventory.5.a=Items in deliveries (amber) and items in asset safety or in an impounded office (red) are the ones people most often lose track of, so they stand out. The How held filter can show only them.
help.faq.inventory.6.q=Why does a character say "Needs authorization"?
help.faq.inventory.6.a=EVE refused the character's saved access: it was revoked, or the character moved to another account. Use Re-authorize on the <a class="link" href="/characters">Characters</a> page. What was stored stays until then.
help.faq.inventory.7.q=Why are my corporation's items missing?
help.faq.inventory.7.a=EVE gives a corporation's assets only to a character with the Director role there. Turn on Corporation assets on the <a class="link" href="/characters">Characters</a> page, link or re-authorize such a character, and open Inventory. The status line says when a corporation has no Director linked.

help.faq.plans.1.q=What is a plan?
help.faq.plans.1.a=A list of ships or items you want to build, with how many of each. EveAssist works out the materials, which parts to build or buy, and what it costs.
help.faq.plans.2.q=Where do the prices come from?
help.faq.plans.2.a=From the Jita market (The Forge), when you add something to a plan or press Refresh prices. A plan stays as quoted until you refresh it, so it does not change under you.
help.faq.plans.3.q=What does "Simplified costing" mean?
help.faq.plans.3.a=For now a plan is costed with every blueprint at material efficiency (ME) 10 and time efficiency (TE) 20, and with each item built in a single job, and with no skills, facilities or taxes. It is a quick, honest first number. Building in several smaller jobs uses more materials, because each job rounds up on its own. The Runs needed section shows how many runs of each blueprint the plan needs.
