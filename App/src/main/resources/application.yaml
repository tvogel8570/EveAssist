# Actuator: only the metrics the concurrency runbook uses, on the app's own port, and only for an admin signed in (see
# SecurityConfig). Health is not exposed until a deployment needs it.
management:
  endpoints:
    web:
      exposure:
        include: metrics
  metrics:
    enable:
      # Spring Boot times every outgoing RestClient call and tags it with the full URL. ESI URLs carry ids (contracts,
      # characters, structures), so every call is a new tag value, the 100-value limit is reached ("Reached the maximum
      # number of 'uri' tags") and character ids would sit in metric names. Nothing uses it. To get per-route ESI
      # metrics, build the URLs from templates in HttpEsiClient first.
      http.client.requests: false
spring:
  application:
    name: eveassist
  messages:
    # The text of the home page (first steps and FAQs) is long, so it has a bundle of its own beside messages.properties.
    basename: messages,help
  profiles:
    default: dev
  config:
    # dev secrets are kept once, beside compose.yaml; elsewhere the same names come from real environment variables
    import: optional:file:../Infrastructure/.env[.properties]
  datasource:
    url: ${EVEASSIST_DB_URL}
    username: eveassist_app
    password: ${EVEASSIST_APP_PASSWORD}
    hikari:
      # Hikari's own default, written down so that it is a visible choice. Symptoms that suggest changing it, and the
      # other concurrency settings, are in documentation/runbooks/concurrency-tuning.md.
      maximum-pool-size: 10
  flyway:
    url: ${EVEASSIST_DB_URL}
    user: eveassist_owner
    password: ${EVEASSIST_OWNER_PASSWORD}
  session:
    jdbc:
      initialize-schema: never
  security:
    oauth2:
      client:
        provider:
          keycloak:
            user-name-attribute: sub
        registration:
          keycloak:
            provider: keycloak
            client-id: eveassist-app
            client-secret: ${KC_APP_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            scope:
            - openid
            - profile
            - email
  http:
    clients:
      # Without these a call to a server that accepts the connection and then says nothing waits forever, holding one of
      # the ESI client's simultaneous-call permits (and, for the contract loader, its run). They apply to every
      # RestClient built from Spring Boot's builder. EsiTimeoutTest checks that a stall before or after the response
      # headers makes a call fail.
      connect-timeout: 5s
      read-timeout: 30s
eveassist:
  characters:
    token-data-key: ${EVE_TOKEN_DATA_KEY:}
    sso:
      client-id: ${EVE_LINK_CLIENT_ID:}
      client-secret: ${EVE_LINK_CLIENT_SECRET:}
      redirect-uri: ${APP_BASE_URL:https://dev.eveassist.com:7444}/characters/link/callback
  esi:
    contact-email: ${ESI_CONTACT_EMAIL:}
server:
  port: 7444
  servlet:
    session:
      cookie:
        http-only: true
        secure: true
        same-site: lax
---
# read from Keycloak at start-up; tests simulate sign-in and have no Keycloak
spring:
  config:
    activate:
      on-profile: "!test & !measure"
  security:
    oauth2:
      client:
        provider:
          keycloak:
            issuer-uri: ${KEYCLOAK_ISSUER_URI}
---
spring:
  config:
    activate:
      on-profile: dev
  ssl:
    bundle:
      pem:
        dev-server:
          keystore:
            certificate: file:../Infrastructure/keycloak/dev.eveassist.com.crt
            private-key: file:../Infrastructure/keycloak/dev.eveassist.com.key
server:
  address: 127.0.0.1
  ssl:
    bundle: dev-server
eveassist:
  dev:
    # Keycloak's dev certificate comes from a private CA, so the JVM does not trust it by default
    trusted-certificate: ../Infrastructure/keycloak/dev.eveassist.com.crt
