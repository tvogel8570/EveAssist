<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page(~{::title}, ~{::main})}">
<head><title th:text="#{account.title}">Your account</title></head>
<body>
<main class="max-w-6xl mx-auto p-4">
    <h1 class="text-xl font-semibold mb-3" th:text="#{account.title}">Your account</h1>
    <dl class="grid grid-cols-[max-content_1fr] gap-x-6 gap-y-2">
        <dt class="opacity-70" th:text="#{account.displayName}">Display name</dt>
        <dd id="display-name" th:text="${account.displayName}">Name</dd>
        <dt class="opacity-70" th:text="#{account.id}">Account id</dt>
        <dd id="account-id" th:text="${account.id.value}">Id</dd>
        <dt class="opacity-70" th:text="#{account.roles}">Roles</dt>
        <dd id="roles" th:text="${#strings.listJoin(roles, ', ')}">Roles</dd>
    </dl>

    <section id="your-data" class="mt-8 max-w-2xl">
        <h2 class="text-lg font-semibold mb-2" th:text="#{account.data.title}">Your data</h2>
        <p class="mb-3" th:text="#{account.data.text}">Text</p>
        <div class="flex flex-wrap gap-2">
            <a id="export-data" class="btn" th:href="@{/account/export}" th:text="#{account.export}">Download my data</a>
            <a id="delete-account" class="btn btn-outline btn-error" th:href="@{/account/delete}" th:text="#{account.delete}">Delete my account</a>
        </div>
        <p class="mt-2 text-sm opacity-70"><a class="link" th:href="@{/privacy}" th:text="#{account.data.privacy}">Privacy policy</a></p>
    </section>
</main>
</body>
</html>
