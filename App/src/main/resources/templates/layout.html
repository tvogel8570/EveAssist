<!doctype html>
<html lang="en" data-theme="dark" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="page(title, content)">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="htmx-config" content='{"noSwap":[204,304,"4xx","5xx"]}'>
    <th:block sec:authorize="isAuthenticated()">
        <meta name="_csrf" th:content="${_csrf.token}">
        <meta name="_csrf_header" th:content="${_csrf.headerName}">
    </th:block>
    <title th:replace="${title}">EveAssist</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script defer th:src="@{/js/htmx.min.js}"></script>
    <script defer th:src="@{/js/app.js}"></script>
</head>
<body class="min-h-screen bg-base-100 text-base-content">
<div class="navbar bg-base-200 px-4 gap-2">
    <a class="text-lg font-semibold mr-4" th:href="@{/}" th:text="#{app.name}">EveAssist</a>
    <a sec:authorize="hasRole('USER')" id="nav-plans" class="btn btn-ghost btn-sm" th:href="@{/plans}" th:text="#{nav.plans}">Plans</a>
    <a sec:authorize="hasRole('USER')" id="nav-bpc" class="btn btn-ghost btn-sm" th:href="@{/market/blueprint-copies}" th:text="#{nav.blueprintCopies}">Blueprint copies</a>
    <a sec:authorize="hasRole('USER')" id="nav-inventory" class="btn btn-ghost btn-sm" th:href="@{/inventory}" th:text="#{nav.inventory}">Inventory</a>
    <a sec:authorize="hasRole('USER')" id="nav-characters" class="btn btn-ghost btn-sm" th:href="@{/characters}" th:text="#{nav.characters}">Characters</a>
    <a sec:authorize="isAnonymous()" id="nav-try" class="btn btn-ghost btn-sm" th:href="@{/try}" th:text="#{nav.try}">Try a plan</a>
    <span class="grow"></span>
    <a sec:authorize="isAnonymous()" id="sign-in" class="btn btn-primary btn-sm" th:href="@{/account}" th:text="#{nav.signIn}">Sign in</a>
    <a sec:authorize="isAuthenticated()" id="account" class="btn btn-ghost btn-sm" th:href="@{/account}" th:text="#{nav.account}">Account</a>
    <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post">
        <button id="sign-out" class="btn btn-ghost btn-sm" type="submit" th:text="#{nav.signOut}">Sign out</button>
    </form>
</div>
<progress id="request-indicator" class="progress progress-primary h-1 w-full block" aria-hidden="true"></progress>
<main class="max-w-6xl mx-auto p-4" th:replace="${content}"></main>
<footer id="site-footer" class="mt-10 bg-base-200 px-4 py-6 text-center text-sm">
    <p th:text="#{footer.operator(${@siteInfo.operatorName})}">EveAssist is run by the operator.</p>
    <p class="mt-1">
        <a id="footer-privacy" class="link" th:href="@{/privacy}" th:text="#{footer.privacy}">Privacy</a>
        <span aria-hidden="true">·</span>
        <a id="footer-security" class="link" th:href="@{/.well-known/security.txt}" th:text="#{footer.security}">Report a vulnerability</a>
        <span aria-hidden="true">·</span>
        <span id="footer-build"
              th:text="${#strings.isEmpty(@siteInfo.version)} ? #{footer.build(${@siteInfo.commit})} : #{footer.buildVersion(${@siteInfo.version}, ${@siteInfo.commit})}">build dev</span>
    </p>
    <p id="ccp-notice" class="mt-3 opacity-70" th:text="#{footer.ccp}">CCP notice</p>
</footer>
<div class="toast toast-end z-30">
    <div id="error-toast" class="alert alert-error" role="alert" hidden
         th:data-failed="#{error.failed}" th:data-conflict="#{error.conflict}" th:data-invalid="#{error.invalid}"
         th:data-units-low="#{plan.unitsTooLow}" th:data-units-high="#{plan.unitsTooHigh}">
        <span></span>
    </div>
</div>
</body>
</html>
